name: Build and Push Container Images

on:
  push:
    branches:
      - master
    tags:
      - "v*.*"
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional Docker tag to publish, for example v0.4"
        required: false
        type: string
      checkout_ref:
        description: "Optional git ref to build. Defaults to image_tag when image_tag is set."
        required: false
        type: string
      push_latest:
        description: "Also publish latest and latest_tiny"
        required: false
        default: true
        type: boolean

env:
  DOCKER_IMAGE_NAME: hangrylabs/omnivoicetts
  GHCR_IMAGE_NAME: ghcr.io/hangry-labs/omnivoicetts

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || inputs.image_tag || github.ref }}

      - name: Free up disk space
        run: |
          echo "Initial disk usage:"
          df -h

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache || true
          docker system prune -af || true

          echo "Disk usage after cleanup:"
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: image_tags
        shell: bash
        run: |
          set -euo pipefail

          version=""
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF##refs/tags/}"
          elif [[ -n "${{ inputs.image_tag }}" ]]; then
            version="${{ inputs.image_tag }}"
          fi

          baked_tags=()
          tiny_tags=()
          if [[ "${GITHUB_REF}" == refs/heads/master && "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            baked_tags+=("${DOCKER_IMAGE_NAME}:latest" "${GHCR_IMAGE_NAME}:latest")
            tiny_tags+=("${DOCKER_IMAGE_NAME}:latest_tiny" "${GHCR_IMAGE_NAME}:latest_tiny")
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.push_latest }}" == "true" ]]; then
            baked_tags+=("${DOCKER_IMAGE_NAME}:latest" "${GHCR_IMAGE_NAME}:latest")
            tiny_tags+=("${DOCKER_IMAGE_NAME}:latest_tiny" "${GHCR_IMAGE_NAME}:latest_tiny")
          fi
          if [[ -n "${version}" ]]; then
            baked_tags+=("${DOCKER_IMAGE_NAME}:${version}" "${GHCR_IMAGE_NAME}:${version}")
            tiny_tags+=("${DOCKER_IMAGE_NAME}:${version}_tiny" "${GHCR_IMAGE_NAME}:${version}_tiny")
          fi

          if [[ "${#baked_tags[@]}" -eq 0 || "${#tiny_tags[@]}" -eq 0 ]]; then
            echo "No Docker tags selected for publishing." >&2
            exit 1
          fi

          {
            echo "baked_tags<<EOF"
            printf '%s\n' "${baked_tags[@]}"
            echo "EOF"
            echo "tiny_tags<<EOF"
            printf '%s\n' "${tiny_tags[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push baked Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: baked
          push: true
          tags: ${{ steps.image_tags.outputs.baked_tags }}

      - name: Report disk usage after baked image
        shell: bash
        run: |
          df -h
          docker buildx du || true

      - name: Build and push tiny Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tiny
          push: true
          tags: ${{ steps.image_tags.outputs.tiny_tags }}

      - name: Report final disk usage
        if: always()
        shell: bash
        run: |
          df -h
          docker buildx du || true
