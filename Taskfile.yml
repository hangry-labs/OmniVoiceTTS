version: '3'

vars:
  IMAGE: omnivoicetts:test
  TINY_IMAGE: omnivoicetts:tiny
  PORT: '7861'
  GPU_DEVICE: '0'
  APP_DEVICE: 'auto'
  HF_TOKEN: ''
  DATA_VOLUME: omnivoicetts_data
  DATA_ROOT: /app/persistent
  RUNTIME_ENV: >-
    -e HF_HOME={{.DATA_ROOT}}/models/huggingface
    -e OMNIVOICE_SETTINGS_PATH={{.DATA_ROOT}}/app/settings.json
    -e OMNIVOICE_OPENAI_VOICE_PROFILE_DIR={{.DATA_ROOT}}/voices/openai
    -v {{.DATA_VOLUME}}:{{.DATA_ROOT}}
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'
  LOAD_ASR: '0'
  ALLOW_CPU_EAGER_ASR: '0'
  CONTAINER: omnivoicetts
  CONTAINER_LOCAL: omnivoicetts_local
  TEMP_AUDIO: '%TEMP%\\omnivoicetts_task_audio'
  API_TEXT: 'Hello world. This is OmniVoiceTTS.'
  API_LANGUAGE: 'English'
  API_VOICE: 'af_heart'
  API_FORMAT: 'mp3'
  SPEED_BENCHMARK_BASE_URL: 'http://127.0.0.1:7861'
  SPEED_BENCHMARK_RESULTS: 'benchmarks\speed\runs.json'
  SPEED_BENCHMARK_DIR: 'benchmarks\speed'
  SPEED_BENCHMARK_SUMMARY: 'benchmarks\speed\BENCHMARKS.md'
  SPEED_BENCHMARK_DETAILS: 'benchmarks\speed\DETAILS.md'
  SPEED_BENCHMARK_VOICE: 'benchmark_original_clone'
  SPEED_BENCHMARK_REF_AUDIO: '/app/omnivoice/runtime_assets/voices/openai_default_voice.mp3'
  SPEED_BENCHMARK_NUM_STEP: '24'
  SPEED_BENCHMARK_FORMAT: 'mp3'
  SPEED_BENCHMARK_LIMIT_LANGUAGES: '0'
  SPEED_BENCHMARK_ITEMS: '100'
  SPEED_BENCHMARK_SAMPLES_PER_LANGUAGE: '2'
  SPEED_BENCHMARK_RANDOM_WARMUP: '10'
  SPEED_BENCHMARK_REFERENCE_WARMUP: '10'
  SPEED_BENCHMARK_COMMENT: ''
  CPU_MEMORY_BENCHMARK_LIMITS: '1536m,2048m,2560m,3072m,4096m,5120m,6144m,7168m,8192m,10240m,12288m'
  CPU_MEMORY_BENCHMARK_RESULTS: 'benchmarks\memory\cpu\runs.json'
  CPU_MEMORY_BENCHMARK_SUMMARY: 'benchmarks\memory\cpu\BENCHMARKS.md'
  CPU_MEMORY_BENCHMARK_DETAILS: 'benchmarks\memory\cpu\DETAILS.md'
  CPU_MEMORY_BENCHMARK_START_PORT: '7870'
  CPU_MEMORY_BENCHMARK_COMMENT: ''
  GPU_MEMORY_BENCHMARK_BASE_URL: 'http://127.0.0.1:7861'
  GPU_MEMORY_BENCHMARK_RESULTS: 'benchmarks\memory\gpu\runs.json'
  GPU_MEMORY_BENCHMARK_SUMMARY: 'benchmarks\memory\gpu\BENCHMARKS.md'
  GPU_MEMORY_BENCHMARK_DETAILS: 'benchmarks\memory\gpu\DETAILS.md'
  GPU_MEMORY_BENCHMARK_CALLS: '5'
  GPU_MEMORY_BENCHMARK_WARMUP: '1'
  GPU_MEMORY_BENCHMARK_SAMPLE_INTERVAL: '0.1'
  GPU_MEMORY_BENCHMARK_COMMENT: ''
  SSML_BENCHMARK_TTS_URL: 'http://127.0.0.1:7861'
  SSML_BENCHMARK_ASR_URL: 'http://127.0.0.1:8000'
  SSML_BENCHMARK_CALLS: '20'
  SSML_BENCHMARK_RESULTS: 'benchmarks\ssml\runs.json'
  SSML_BENCHMARK_SUMMARY: 'benchmarks\ssml\BENCHMARKS.md'
  SSML_BENCHMARK_DETAILS: 'benchmarks\ssml\DETAILS.md'
  SSML_BENCHMARK_COMMENT: ''
  QUALITY_BENCHMARK_TTS_URL: 'http://127.0.0.1:7861'
  QUALITY_BENCHMARK_ASR_URL: 'http://127.0.0.1:8000'
  QUALITY_BENCHMARK_RESULTS: 'benchmarks\speech-quality\runs.json'
  QUALITY_BENCHMARK_SUMMARY: 'benchmarks\speech-quality\BENCHMARKS.md'
  QUALITY_BENCHMARK_DETAILS: 'benchmarks\speech-quality\DETAILS.md'
  QUALITY_BENCHMARK_ARTIFACTS: '.ai\benchmark-speech-quality'
  QUALITY_BENCHMARK_SENTENCES: '2'
  QUALITY_BENCHMARK_REPEATS: '5'
  QUALITY_BENCHMARK_NUM_STEP: '32'
  QUALITY_BENCHMARK_COMMENT: ''
  CODEQL: 'C:\sandbox\tools\codeql\codeql.exe'
  DRY_RUN: '0'
  NEXT_VERSION: ''
  SKIP_VALIDATION: '0'
  NAS_HOST: '192.168.10.148'
  NAS_SSH_PORT: '1022'
  NAS_USER: 'admin'

tasks:
  list:
    desc: List available tasks
    cmds:
      - task --list

  doctor:
    desc: Show local tool, interpreter, Docker, GPU, and repository status
    cmds:
      - cmd /c python --version
      - 'cmd /c ".venv\Scripts\python.exe" --version'
      - cmd /c docker --version
      - cmd /c task --version
      - cmd /c nvidia-smi --query-gpu=index,name,memory.total,memory.used --format=csv,noheader
      - cmd /c git status --short

  compile:
    desc: Compile Python sources and tests
    cmds:
      - 'cmd /c ".venv\Scripts\python.exe" -m compileall -q omnivoice scripts benchmarks tests'

  test:
    desc: Run the lightweight unit and repository-contract test suite
    cmds:
      - 'cmd /c ".venv\Scripts\python.exe" -m unittest discover -s tests -v'

  validate:
    desc: Run local lightweight validation used before Docker and release work
    cmds:
      - task: compile
      - task: test
      - uv lock --check
      - docker build --check .

  gpuinfo:
    desc: Show host GPU indexes
    cmds:
      - cmd /c nvidia-smi --query-gpu=index,name --format=csv,noheader

  nas-shell:
    desc: Open SSH shell to the Synology NAS
    cmds:
      - ssh -p {{.NAS_SSH_PORT}} {{.NAS_USER}}@{{.NAS_HOST}}

  image:
    desc: Build local baked OmniVoiceTTS Docker image
    cmds:
      - cmd /c docker build --target baked -t {{.IMAGE}} .

  image-tiny:
    desc: Build local tiny OmniVoiceTTS Docker image without baked model cache
    cmds:
      - cmd /c docker build --target tiny -t {{.TINY_IMAGE}} .

  cache-init:
    desc: Create the unified persistent product volume (Docker seeds baked assets on first mount)
    cmds:
      - cmd /c docker volume create {{.DATA_VOLUME}} >nul

  init-clean:
    desc: Remove known local OmniVoiceTTS deployment containers without touching volumes or images
    cmds:
      - cmd /c docker rm -f {{.CONTAINER}} {{.CONTAINER_LOCAL}} omnivoicetts_openai_test omnivoicetts_memory_test omnivoicetts_cpu_bug omnivoicetts_cpu_warn >nul 2>&1 || exit /b 0

  init:
    desc: Clean local OmniVoiceTTS deployments and start one hot-reload instance from the existing image
    cmds:
      - task: init-clean
      - task: cache-init
      - cmd /c docker run -d --name {{.CONTAINER_LOCAL}} -p {{.PORT}}:7861 --gpus all {{.RUNTIME_ENV}} -e CUDA_VISIBLE_DEVICES={{.GPU_DEVICE}} -e OMNIVOICE_DEVICE={{.APP_DEVICE}} -e OMNIVOICE_LOAD_ASR={{.LOAD_ASR}} -e OMNIVOICE_ALLOW_CPU_EAGER_ASR={{.ALLOW_CPU_EAGER_ASR}} -e PORT=7861 -e UVICORN_RELOAD=1 -e HF_TOKEN={{.HF_TOKEN}} -e HF_HUB_OFFLINE={{.HF_HUB_OFFLINE}} -e TRANSFORMERS_OFFLINE={{.TRANSFORMERS_OFFLINE}} -v "{{.TASKFILE_DIR}}\omnivoice:/app/omnivoice" -v "{{.TASKFILE_DIR}}\assets:/app/assets" -v "{{.TASKFILE_DIR}}\VERSION:/app/VERSION:ro" {{.IMAGE}}
      - cmd /c docker ps --filter "name={{.CONTAINER_LOCAL}}"

  release:
    desc: Release the current VERSION snapshot, tag and push it, then prepare the next snapshot
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/release.ps1 -DryRun "{{.DRY_RUN}}" -NextVersion "{{.NEXT_VERSION}}" -SkipValidation "{{.SKIP_VALIDATION}}"

  deps:
    desc: Regenerate Linux/Python 3.13 requirements.txt from requirements.in
    cmds:
      - uv pip compile requirements.in --python-version 3.13 --python-platform x86_64-manylinux_2_36 --index-strategy unsafe-best-match --upgrade --no-header --no-annotate --output-file requirements.txt

  codeql-version:
    desc: Show local CodeQL CLI version
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{{.CODEQL}}' version"

  codeql:
    desc: Run CodeQL Python security-and-quality analysis on public project files
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run_codeql.ps1 -CodeqlExe "{{.CODEQL}}"

  imagerun:
    desc: Run baked image with UI/API and the unified persistent product volume
    cmds:
      - cmd /c docker rm -f {{.CONTAINER}} >nul 2>&1
      - cmd /c docker rm -f {{.CONTAINER_LOCAL}} >nul 2>&1
      - task: cache-init
      - cmd /c docker run -d --name {{.CONTAINER}} -p {{.PORT}}:7861 --gpus all {{.RUNTIME_ENV}} -e CUDA_VISIBLE_DEVICES={{.GPU_DEVICE}} -e OMNIVOICE_DEVICE={{.APP_DEVICE}} -e OMNIVOICE_LOAD_ASR={{.LOAD_ASR}} -e OMNIVOICE_ALLOW_CPU_EAGER_ASR={{.ALLOW_CPU_EAGER_ASR}} -e PORT=7861 -e HF_TOKEN={{.HF_TOKEN}} -e HF_HUB_OFFLINE={{.HF_HUB_OFFLINE}} -e TRANSFORMERS_OFFLINE={{.TRANSFORMERS_OFFLINE}} {{.IMAGE}}
      - cmd /c docker update --restart unless-stopped {{.CONTAINER}}
      - cmd /c docker ps --filter "name={{.CONTAINER}}"

  imagerun-tiny:
    desc: Run tiny image online on first use, using the unified persistent product volume
    cmds:
      - cmd /c docker rm -f {{.CONTAINER}} >nul 2>&1
      - cmd /c docker rm -f {{.CONTAINER_LOCAL}} >nul 2>&1
      - task: cache-init
      - cmd /c docker run -d --name {{.CONTAINER}} -p {{.PORT}}:7861 --gpus all {{.RUNTIME_ENV}} -e CUDA_VISIBLE_DEVICES={{.GPU_DEVICE}} -e OMNIVOICE_DEVICE={{.APP_DEVICE}} -e OMNIVOICE_LOAD_ASR={{.LOAD_ASR}} -e OMNIVOICE_ALLOW_CPU_EAGER_ASR={{.ALLOW_CPU_EAGER_ASR}} -e PORT=7861 -e HF_TOKEN={{.HF_TOKEN}} -e HF_HUB_OFFLINE=0 -e TRANSFORMERS_OFFLINE=0 {{.TINY_IMAGE}}
      - cmd /c docker update --restart unless-stopped {{.CONTAINER}}
      - cmd /c docker ps --filter "name={{.CONTAINER}}"

  localrun:
    desc: Run baked image with local omnivoice/ bind-mounted for hot-swapping
    cmds:
      - cmd /c docker rm -f {{.CONTAINER}} >nul 2>&1
      - cmd /c docker rm -f {{.CONTAINER_LOCAL}} >nul 2>&1
      - task: cache-init
      - cmd /c docker run -d --name {{.CONTAINER_LOCAL}} -p {{.PORT}}:7861 --gpus all {{.RUNTIME_ENV}} -e CUDA_VISIBLE_DEVICES={{.GPU_DEVICE}} -e OMNIVOICE_DEVICE={{.APP_DEVICE}} -e OMNIVOICE_LOAD_ASR={{.LOAD_ASR}} -e OMNIVOICE_ALLOW_CPU_EAGER_ASR={{.ALLOW_CPU_EAGER_ASR}} -e PORT=7861 -e UVICORN_RELOAD=1 -e HF_TOKEN={{.HF_TOKEN}} -e HF_HUB_OFFLINE={{.HF_HUB_OFFLINE}} -e TRANSFORMERS_OFFLINE={{.TRANSFORMERS_OFFLINE}} -v "{{.TASKFILE_DIR}}\omnivoice:/app/omnivoice" -v "{{.TASKFILE_DIR}}\assets:/app/assets" -v "{{.TASKFILE_DIR}}\VERSION:/app/VERSION:ro" {{.IMAGE}}
      - cmd /c docker ps --filter "name={{.CONTAINER_LOCAL}}"

  localrun-tiny:
    desc: Run tiny image with local omnivoice/ bind-mounted, online on first use
    cmds:
      - cmd /c docker rm -f {{.CONTAINER}} >nul 2>&1
      - cmd /c docker rm -f {{.CONTAINER_LOCAL}} >nul 2>&1
      - task: cache-init
      - cmd /c docker run -d --name {{.CONTAINER_LOCAL}} -p {{.PORT}}:7861 --gpus all {{.RUNTIME_ENV}} -e CUDA_VISIBLE_DEVICES={{.GPU_DEVICE}} -e OMNIVOICE_DEVICE={{.APP_DEVICE}} -e OMNIVOICE_LOAD_ASR={{.LOAD_ASR}} -e OMNIVOICE_ALLOW_CPU_EAGER_ASR={{.ALLOW_CPU_EAGER_ASR}} -e PORT=7861 -e UVICORN_RELOAD=1 -e HF_TOKEN={{.HF_TOKEN}} -e HF_HUB_OFFLINE=0 -e TRANSFORMERS_OFFLINE=0 -v "{{.TASKFILE_DIR}}\omnivoice:/app/omnivoice" -v "{{.TASKFILE_DIR}}\assets:/app/assets" -v "{{.TASKFILE_DIR}}\VERSION:/app/VERSION:ro" {{.TINY_IMAGE}}
      - cmd /c docker ps --filter "name={{.CONTAINER_LOCAL}}"

  imageweb:
    desc: Open default browser to local OmniVoiceTTS UI
    cmds:
      - cmd /c start "" "http://localhost:{{.PORT}}"

  localps:
    desc: Show likely local dev app processes
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/local-processes.ps1 -Mode scan -RepoPath "{{.TASKFILE_DIR}}"

  localports:
    desc: Show likely local dev app processes plus listening ports
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/local-processes.ps1 -Mode scan -RepoPath "{{.TASKFILE_DIR}}" -IncludePorts

  localclean:
    desc: Stop Python/Node/dev processes whose command line references this repo
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/local-processes.ps1 -Mode clean -RepoPath "{{.TASKFILE_DIR}}"

  appinject:
    desc: Inject local omnivoice/app.py into the running baked container and restart it
    cmds:
      - cmd /c docker cp "{{.TASKFILE_DIR}}\omnivoice\app.py" {{.CONTAINER}}:/app/omnivoice/app.py
      - cmd /c docker restart {{.CONTAINER}}
      - cmd /c docker ps --filter "name={{.CONTAINER}}"

  imageapi:
    desc: Call API, play generated temp audio, then remove it
    cmds:
      - 'cmd /c curl.exe -sS --retry 60 --retry-delay 2 --retry-connrefused http://localhost:{{.PORT}}/tts/ping >nul'
      - 'cmd /c curl.exe -sS -X POST http://localhost:{{.PORT}}/tts/generate -H "Content-Type: application/json" -d "{\"text\":\"{{.API_TEXT}}\",\"voice\":\"{{.API_VOICE}}\",\"language\":\"{{.API_LANGUAGE}}\",\"speed\":1.0,\"device\":\"{{.APP_DEVICE}}\",\"output_format\":\"{{.API_FORMAT}}\"}" --output {{.TEMP_AUDIO}}.{{.API_FORMAT}}'
      - 'cmd /c if not exist {{.TEMP_AUDIO}}.{{.API_FORMAT}} exit /b 1'
      - 'cmd /c python -c "from pathlib import Path; p=Path(r''{{.TEMP_AUDIO}}.{{.API_FORMAT}}''); assert p.exists() and p.stat().st_size > 0, p"'
      - 'powershell -NoProfile -ExecutionPolicy Bypass -File scripts/play-audio.ps1 -Path "{{.TEMP_AUDIO}}.{{.API_FORMAT}}"'
      - 'cmd /c del /f /q {{.TEMP_AUDIO}}.{{.API_FORMAT}}'

  imageapi-format:
    desc: Call API for API_FORMAT and verify the output file is non-empty
    cmds:
      - 'cmd /c curl.exe -sS --retry 60 --retry-delay 2 --retry-connrefused http://localhost:{{.PORT}}/tts/ping >nul'
      - 'cmd /c curl.exe -sS -X POST http://localhost:{{.PORT}}/tts/generate -H "Content-Type: application/json" -d "{\"text\":\"{{.API_TEXT}}\",\"voice\":\"{{.API_VOICE}}\",\"language\":\"{{.API_LANGUAGE}}\",\"speed\":1.0,\"device\":\"{{.APP_DEVICE}}\",\"output_format\":\"{{.API_FORMAT}}\"}" --output {{.TEMP_AUDIO}}.{{.API_FORMAT}}'
      - 'cmd /c if not exist {{.TEMP_AUDIO}}.{{.API_FORMAT}} exit /b 1'
      - 'cmd /c python -c "from pathlib import Path; p=Path(r''{{.TEMP_AUDIO}}.{{.API_FORMAT}}''); assert p.exists() and p.stat().st_size > 0, p"'
      - 'cmd /c del /f /q {{.TEMP_AUDIO}}.{{.API_FORMAT}}'

  benchmark-doctor:
    desc: Check the TTS, ASR, and selected GPU expected by manual benchmarks
    cmds:
      - cmd /c nvidia-smi --id={{.GPU_DEVICE}} --query-gpu=index,name,driver_version,memory.total,memory.used --format=csv,noheader
      - cmd /c curl.exe -fsS {{.QUALITY_BENCHMARK_TTS_URL}}/tts/status
      - cmd /c curl.exe -fsS {{.QUALITY_BENCHMARK_ASR_URL}}/health/ready

  benchmark-speed:
    aliases: [benchmark-examples]
    desc: Append the fixed warmed and prewarm inference-speed benchmark
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -Command ".\.venv\Scripts\python.exe benchmarks\speed\run_benchmark.py --base-url '{{.SPEED_BENCHMARK_BASE_URL}}' --manifest examples\assets\manifest.json --results '{{.SPEED_BENCHMARK_RESULTS}}' --markdown-dir '{{.SPEED_BENCHMARK_DIR}}' --summary '{{.SPEED_BENCHMARK_SUMMARY}}' --details '{{.SPEED_BENCHMARK_DETAILS}}' --voice '{{.SPEED_BENCHMARK_VOICE}}' --reference-audio '{{.SPEED_BENCHMARK_REF_AUDIO}}' --num-step '{{.SPEED_BENCHMARK_NUM_STEP}}' --format '{{.SPEED_BENCHMARK_FORMAT}}' --limit-languages '{{.SPEED_BENCHMARK_LIMIT_LANGUAGES}}' --items-per-round '{{.SPEED_BENCHMARK_ITEMS}}' --samples-per-language '{{.SPEED_BENCHMARK_SAMPLES_PER_LANGUAGE}}' --random-warmup '{{.SPEED_BENCHMARK_RANDOM_WARMUP}}' --reference-warmup '{{.SPEED_BENCHMARK_REFERENCE_WARMUP}}' --comment '{{.SPEED_BENCHMARK_COMMENT}}'"

  benchmark-speed-smoke:
    desc: Exercise one language and one call per speed stage without recording history
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -Command ".\.venv\Scripts\python.exe benchmarks\speed\run_benchmark.py --base-url '{{.SPEED_BENCHMARK_BASE_URL}}' --limit-languages 1 --items-per-round 1 --samples-per-language 1 --random-warmup 1 --reference-warmup 1 --no-write"

  benchmark-memory-cpu:
    aliases: [benchmark-cpu-memory]
    desc: Append CPU Docker memory-limit results for all supported voice scenarios
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -Command ".\.venv\Scripts\python.exe benchmarks\memory\cpu\run_benchmark.py --image '{{.IMAGE}}' --limits '{{.CPU_MEMORY_BENCHMARK_LIMITS}}' --start-port '{{.CPU_MEMORY_BENCHMARK_START_PORT}}' --results '{{.CPU_MEMORY_BENCHMARK_RESULTS}}' --markdown '{{.CPU_MEMORY_BENCHMARK_SUMMARY}}' --details '{{.CPU_MEMORY_BENCHMARK_DETAILS}}' --comment '{{.CPU_MEMORY_BENCHMARK_COMMENT}}'"

  benchmark-memory-cpu-smoke:
    desc: Exercise one constrained CPU random-voice case without recording history
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -Command ".\.venv\Scripts\python.exe benchmarks\memory\cpu\run_benchmark.py --image '{{.IMAGE}}' --limits 1536m --scenarios RV --passes-after-first 0 --start-port '{{.CPU_MEMORY_BENCHMARK_START_PORT}}' --no-write"

  benchmark-memory-gpu:
    desc: Append warmed process and whole-device GPU memory results by voice mode
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -Command ".\.venv\Scripts\python.exe benchmarks\memory\gpu\run_benchmark.py --base-url '{{.GPU_MEMORY_BENCHMARK_BASE_URL}}' --gpu-index '{{.GPU_DEVICE}}' --calls '{{.GPU_MEMORY_BENCHMARK_CALLS}}' --warmup-calls '{{.GPU_MEMORY_BENCHMARK_WARMUP}}' --sample-interval '{{.GPU_MEMORY_BENCHMARK_SAMPLE_INTERVAL}}' --results '{{.GPU_MEMORY_BENCHMARK_RESULTS}}' --summary '{{.GPU_MEMORY_BENCHMARK_SUMMARY}}' --details '{{.GPU_MEMORY_BENCHMARK_DETAILS}}' --comment '{{.GPU_MEMORY_BENCHMARK_COMMENT}}'"

  benchmark-memory-gpu-smoke:
    desc: Exercise one GPU-memory scenario and call without recording history
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -Command ".\.venv\Scripts\python.exe benchmarks\memory\gpu\run_benchmark.py --base-url '{{.GPU_MEMORY_BENCHMARK_BASE_URL}}' --gpu-index '{{.GPU_DEVICE}}' --calls 1 --warmup-calls 1 --limit-scenarios 1 --no-write"

  benchmark-ssml:
    aliases: [benchmark-ssml-h-reliability]
    desc: Append deterministic SSML-H dialogue-completion results through local TTS and Qwen3-ASR
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -Command ".\.venv\Scripts\python.exe benchmarks\ssml\run_benchmark.py --tts-url '{{.SSML_BENCHMARK_TTS_URL}}' --asr-url '{{.SSML_BENCHMARK_ASR_URL}}' --calls '{{.SSML_BENCHMARK_CALLS}}' --results '{{.SSML_BENCHMARK_RESULTS}}' --markdown '{{.SSML_BENCHMARK_SUMMARY}}' --details '{{.SSML_BENCHMARK_DETAILS}}' --comment '{{.SSML_BENCHMARK_COMMENT}}'"

  benchmark-ssml-smoke:
    desc: Exercise the known SSML-H regression seed once without recording history
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -Command ".\.venv\Scripts\python.exe benchmarks\ssml\run_benchmark.py --tts-url '{{.SSML_BENCHMARK_TTS_URL}}' --asr-url '{{.SSML_BENCHMARK_ASR_URL}}' --calls 1 --no-write"

  benchmark-speech-quality:
    desc: Append multilingual TTS-to-Qwen-ASR quality, consistency, timing, and VRAM results
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -Command ".\.venv\Scripts\python.exe benchmarks\speech-quality\run_benchmark.py --tts-url '{{.QUALITY_BENCHMARK_TTS_URL}}' --asr-url '{{.QUALITY_BENCHMARK_ASR_URL}}' --manifest examples\assets\manifest.json --results '{{.QUALITY_BENCHMARK_RESULTS}}' --summary '{{.QUALITY_BENCHMARK_SUMMARY}}' --details '{{.QUALITY_BENCHMARK_DETAILS}}' --artifacts-dir '{{.QUALITY_BENCHMARK_ARTIFACTS}}' --sentences '{{.QUALITY_BENCHMARK_SENTENCES}}' --repeats '{{.QUALITY_BENCHMARK_REPEATS}}' --num-step '{{.QUALITY_BENCHMARK_NUM_STEP}}' --gpu-index '{{.GPU_DEVICE}}' --comment '{{.QUALITY_BENCHMARK_COMMENT}}'"

  benchmark-speech-quality-smoke:
    desc: Exercise one English TTS-to-ASR quality call without recording history
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -Command ".\.venv\Scripts\python.exe benchmarks\speech-quality\run_benchmark.py --tts-url '{{.QUALITY_BENCHMARK_TTS_URL}}' --asr-url '{{.QUALITY_BENCHMARK_ASR_URL}}' --languages english --sentences 1 --repeats 1 --num-step '{{.QUALITY_BENCHMARK_NUM_STEP}}' --gpu-index '{{.GPU_DEVICE}}' --no-write"

  imagestop:
    desc: Stop running OmniVoiceTTS containers
    cmds:
      - cmd: cmd /c docker stop {{.CONTAINER}} >nul 2>&1
        ignore_error: true
      - cmd: cmd /c docker stop {{.CONTAINER_LOCAL}} >nul 2>&1
        ignore_error: true

  logs:
    desc: Show logs from active OmniVoiceTTS container
    cmds:
      - cmd /c docker logs --tail 200 {{.CONTAINER_LOCAL}} 2>nul || docker logs --tail 200 {{.CONTAINER}}

  nuke:
    desc: Remove OmniVoiceTTS local containers, images, and unified data volume
    cmds:
      - cmd /c docker rm -f {{.CONTAINER}} >nul 2>&1
      - cmd /c docker rm -f {{.CONTAINER_LOCAL}} >nul 2>&1
      - cmd /c docker rmi -f {{.IMAGE}} >nul 2>&1
      - cmd /c docker rmi -f {{.TINY_IMAGE}} >nul 2>&1
      - cmd /c docker volume rm -f {{.DATA_VOLUME}} >nul 2>&1
