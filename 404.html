<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Page Not Found | OmniVoiceTTS</title>
    <link rel="icon" type="image/webp" href="assets/omnivoice_favicon.webp">
    <link rel="stylesheet" href="examples/styles.css">
    <style>
      .not-found { min-height: 100vh; align-items: center; }
      .not-found-copy { align-self: center; }
      .not-found-code { font-size: 5rem; }
      .not-found-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
      .not-found-art { display: block; width: 100%; border: 2px solid rgba(255, 107, 0, 0.32); border-radius: 8px; box-shadow: 0 0 28px rgba(255, 107, 0, 0.22), 0 0 80px rgba(255, 60, 0, 0.14); }
    </style>
  </head>
  <body>
    <canvas id="shapes" aria-hidden="true"></canvas>
    <main class="page-shell">
      <div class="page-content">
        <section class="hero not-found">
          <div class="not-found-copy">
            <a class="brand-lockup" href="https://hangrylabs.app/" target="_blank" rel="noopener noreferrer">
              <img class="brand-logo" src="assets/hangrylabs_mascot.webp" alt="Hangry Labs">
              <span><strong>Hangry Labs</strong><small>Useful tools, easy to run</small></span>
            </a>
            <h1 class="not-found-code">404</h1>
            <p class="intro">This page does not exist, but the OmniVoiceTTS examples are ready to play.</p>
            <nav class="not-found-links" aria-label="Project links">
              <a class="pill action-link" href="examples/">Open examples</a>
              <a class="pill action-link" href="https://github.com/Hangry-Labs/OmniVoiceTTS">GitHub</a>
              <a class="pill action-link" href="https://hangrylabs.app/">hangrylabs.app</a>
            </nav>
          </div>
          <div class="hero-logo-panel">
            <img class="not-found-art" src="assets/404.webp" alt="Page not found">
          </div>
        </section>
      </div>
    </main>
    <script src="examples/background.js"></script>
  </body>
</html>
